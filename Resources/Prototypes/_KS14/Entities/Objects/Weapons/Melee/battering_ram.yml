# Ported from SurfShack13's /obj/item/batteringram (added by hyperjll, SurfShack13 PR #109).

- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: KsBatteringRam
  name: battering ram
  description: An extremely heavy and unwieldy hunk of metal coated in insulating rubber used to break down airlocks. Why would anyone ram a sliding airlock?
  components:
  - type: Tag
    tags:
    - KsBatteringRam
  - type: Sprite
    sprite: _KS14/Objects/Weapons/Melee/battering_ram.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Wieldable
  - type: MeleeRequiresWield
  - type: MeleeWeapon
    attackRate: 0.75 # stands in for SurfShack's half-second wind-up before each swing
    wideAnimationRotation: 135
    damage:
      types:
        Blunt: 20
        Structural: 50 # ~9 hits to break a standard airlock, as on SurfShack
    soundHit:
      path: /Audio/_KS14/Weapons/BatteringRam/bang.ogg
  - type: MeleeThrowOnHit
    distance: 1
    speed: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 14
  - type: Clothing
    sprite: _KS14/Objects/Weapons/Melee/battering_ram.rsi
    quickEquip: false
    slots:
    - back
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: HeldGrantComponent # the rubber coating: no getting shocked by the doors you're breaching
    component:
      - type: Insulated
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_KS14/Weapons/BatteringRam/heavy_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_KS14/Weapons/BatteringRam/heavy_drop.ogg
  - type: KsBatteringRam
